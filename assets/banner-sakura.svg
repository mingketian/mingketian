<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-label="Mingke Tian — cherry blossom banner">
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#fffaf6"/><stop offset=".38" stop-color="#ffeef2"/>
      <stop offset=".72" stop-color="#fbdce6"/><stop offset="1" stop-color="#f3c6d8"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4d9" stop-opacity=".95"/><stop offset="1" stop-color="#fff4d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c3d3"/><stop offset="1" stop-color="#e5aec4"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbdde6"/><stop offset="1" stop-color="#f4cbdb"/>
    </linearGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5346"/><stop offset="1" stop-color="#4e332b"/>
    </linearGradient>
    <radialGradient id="pt" cx="38%" cy="30%" r="76%">
      <stop offset="0" stop-color="#fffafc"/><stop offset=".55" stop-color="#fcd9e5"/>
      <stop offset="1" stop-color="#f2a9c6"/>
    </radialGradient>
    <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="bl2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="fr"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .d1,.d2,.d3,.d4,.d5 { animation: dr 14s linear infinite; }
    .d2{animation-delay:2.8s}.d3{animation-delay:5.6s}.d4{animation-delay:8.4s}.d5{animation-delay:11.2s}
    @keyframes dr { 0%{opacity:0;transform:translate(0,0) rotate(0)} 8%{opacity:.95}
                    88%{opacity:.95} 100%{opacity:0;transform:translate(-70px,300px) rotate(300deg)} }
    .sway { animation: sw 7s ease-in-out infinite; transform-origin: 0% 0%; transform-box: fill-box; }
    @keyframes sw { 0%,100%{transform:rotate(-.7deg)} 50%{transform:rotate(.7deg)} }
    @media (prefers-reduced-motion: reduce){ .d1,.d2,.d3,.d4,.d5,.sway{animation:none} }
  </style>

  <g clip-path="url(#fr)">
    <rect width="1200" height="320" fill="url(#sk)"/>
    <circle cx="980" cy="70" r="150" fill="url(#sun)"/>
    <g filter="url(#bl)" opacity=".5">
      <circle cx="1080" cy="46" r="30" fill="#ffe9f0"/><circle cx="150" cy="60" r="34" fill="#fff3f6"/>
    </g>

    <path d="M0 246 C 150 214, 300 226, 430 254 C 540 278, 640 272, 760 246 C 880 220, 1030 226, 1200 258 L1200 320 L0 320 Z"
          fill="url(#hillB)" opacity=".85"/>
    <path d="M0 282 C 180 258, 340 272, 520 292 C 700 312, 900 300, 1200 278 L1200 320 L0 320 Z" fill="url(#hillA)"/>

    <!-- upper branch -->
    <g class="sway">
      <path d="M-10 26 C 130 42, 246 74, 344 120" fill="none" stroke="url(#bk)" stroke-width="11" stroke-linecap="round"/>
      <path d="M118 38 C 132 16, 150 6, 176 2" fill="none" stroke="url(#bk)" stroke-width="6" stroke-linecap="round"/>
      <path d="M238 70 C 252 92, 256 110, 250 130" fill="none" stroke="url(#bk)" stroke-width="5" stroke-linecap="round"/>
      <path d="M300 98 C 322 90, 342 88, 360 92" fill="none" stroke="url(#bk)" stroke-width="4.5" stroke-linecap="round"/>
      <g fill="url(#pt)">
        <g><circle cx="176" cy="2" r="12"/><circle cx="192" cy="12" r="10"/><circle cx="166" cy="16" r="9"/><circle cx="186" cy="26" r="8"/></g>
        <g><circle cx="62" cy="30" r="12"/><circle cx="78" cy="22" r="9.5"/><circle cx="50" cy="44" r="9"/></g>
        <g><circle cx="250" cy="134" r="12.5"/><circle cx="266" cy="142" r="10"/><circle cx="238" cy="146" r="9"/></g>
        <g><circle cx="362" cy="92" r="12"/><circle cx="378" cy="100" r="9.5"/><circle cx="354" cy="106" r="8.5"/></g>
        <circle cx="126" cy="52" r="9"/><circle cx="206" cy="58" r="10"/><circle cx="300" cy="100" r="9"/>
      </g>
      <g fill="#fbdf9e">
        <circle cx="178" cy="12" r="3.2"/><circle cx="63" cy="36" r="3"/><circle cx="252" cy="140" r="3.2"/><circle cx="364" cy="99" r="3"/>
      </g>
    </g>

    <!-- lower-right branch -->
    <g transform="translate(1200,320) rotate(180)"><g class="sway">
      <path d="M-10 20 C 120 34, 220 62, 306 104" fill="none" stroke="url(#bk)" stroke-width="9" stroke-linecap="round"/>
      <path d="M104 30 C 118 12, 134 4, 156 0" fill="none" stroke="url(#bk)" stroke-width="5" stroke-linecap="round"/>
      <g fill="url(#pt)">
        <g><circle cx="156" cy="0" r="11"/><circle cx="170" cy="10" r="9"/><circle cx="146" cy="14" r="8"/></g>
        <g><circle cx="54" cy="26" r="11"/><circle cx="68" cy="18" r="8.5"/></g>
        <g><circle cx="308" cy="106" r="11.5"/><circle cx="322" cy="114" r="9"/><circle cx="298" cy="118" r="8"/></g>
        <circle cx="222" cy="66" r="9"/>
      </g>
    </g></g>

    <g fill="url(#pt)">
      <ellipse class="d1" cx="420" cy="-10" rx="8"   ry="5.5"/>
      <ellipse class="d2" cx="640" cy="-20" rx="7"   ry="5"/>
      <ellipse class="d3" cx="830" cy="-14" rx="8.5" ry="6"/>
      <ellipse class="d4" cx="1010" cy="-24" rx="7"  ry="5"/>
      <ellipse class="d5" cx="530" cy="-30" rx="6.5" ry="4.5"/>
    </g>

    <g filter="url(#bl2)" opacity=".45" fill="#ffffff">
      <circle cx="700" cy="120" r="5"/><circle cx="760" cy="170" r="3.5"/><circle cx="660" cy="200" r="4"/>
    </g>

    <g text-anchor="middle">
      <text x="600" y="152" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
            font-size="58" letter-spacing="3" fill="#7d4a5c">Mingke Tian</text>
      <text x="600" y="188" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="17" letter-spacing="5.5" fill="#a8708a">COMPUTATIONAL MATHEMATICS &amp; COMPUTER SCIENCE</text>
      <line x1="470" y1="208" x2="730" y2="208" stroke="#d79ab3" stroke-width="1.2"/>
      <text x="600" y="234" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="15" letter-spacing="1.6" fill="#9a6a80">multimodal ML · agentic systems · world models</text>
    </g>
  </g>
</svg>
