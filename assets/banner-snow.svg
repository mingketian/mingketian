<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-label="Mingke Tian — snow and pine banner">
  <defs>
    <linearGradient id="sk" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#f6fbff"/><stop offset=".32" stop-color="#e4eff9"/>
      <stop offset=".66" stop-color="#cfe2f2"/><stop offset="1" stop-color="#eaf3ee"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7e4" stop-opacity=".9"/><stop offset="1" stop-color="#fff7e4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pn" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#5e9b7c"/><stop offset=".55" stop-color="#3f7a60"/><stop offset="1" stop-color="#2c5b47"/>
    </linearGradient>
    <linearGradient id="pn2" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#7fb595"/><stop offset="1" stop-color="#4d8a6c"/>
    </linearGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5647"/><stop offset="1" stop-color="#463629"/>
    </linearGradient>
    <linearGradient id="sn" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2ecf6"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd2e6"/><stop offset="1" stop-color="#d7e5f1"/>
    </linearGradient>
    <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="15"/></filter>
    <clipPath id="fr"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .s1,.s2,.s3,.s4,.s5,.s6 { animation: snow 12s linear infinite; }
    .s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}.s5{animation-delay:8s}.s6{animation-delay:10s}
    @keyframes snow { 0%{opacity:0;transform:translate(0,0)} 10%{opacity:.9}
                      86%{opacity:.9} 100%{opacity:0;transform:translate(-40px,330px)} }
    .bough { animation: bw 9s ease-in-out infinite; transform-origin: 0% 0%; transform-box: fill-box; }
    @keyframes bw { 0%,100%{transform:rotate(-.6deg)} 50%{transform:rotate(.6deg)} }
    @media (prefers-reduced-motion: reduce){ .s1,.s2,.s3,.s4,.s5,.s6,.bough{animation:none} }
  </style>

  <g clip-path="url(#fr)">
    <rect width="1200" height="320" fill="url(#sk)"/>
    <circle cx="900" cy="64" r="150" fill="url(#sun)"/>
    <g filter="url(#bl)" opacity=".4"><circle cx="150" cy="70" r="46" fill="#ffffff"/><circle cx="1060" cy="220" r="50" fill="#f2f9ff"/></g>

    <!-- distant pines -->
    <g opacity=".45" fill="url(#far)">
      <path d="M60 248 L84 176 L108 248 Z"/><path d="M68 216 L84 186 L100 216 Z"/>
      <path d="M130 252 L150 192 L170 252 Z"/>
      <path d="M1040 248 L1064 178 L1088 248 Z"/><path d="M1048 218 L1064 188 L1080 218 Z"/>
      <path d="M980 252 L998 198 L1016 252 Z"/>
    </g>

    <path d="M0 250 C 160 226, 330 238, 480 262 C 650 290, 850 282, 1200 248 L1200 320 L0 320 Z" fill="#e7f0f8"/>
    <path d="M0 284 C 200 262, 390 280, 590 300 C 800 320, 990 308, 1200 284 L1200 320 L0 320 Z" fill="url(#sn)"/>

    <!-- snow-laden pine bough, top left -->
    <g class="bough">
      <path d="M-10 24 C 110 38, 216 68, 306 116" fill="none" stroke="url(#bk)" stroke-width="10" stroke-linecap="round"/>
      <g>
        <path d="M40 28 C 22 6, 4 -4, -14 -6 C -4 18, 16 32, 40 28 Z" fill="url(#pn)"/>
        <path d="M96 42 C 82 16, 66 4, 46 0 C 54 26, 72 42, 96 42 Z" fill="url(#pn2)"/>
        <path d="M154 58 C 144 30, 130 16, 110 10 C 114 38, 130 56, 154 58 Z" fill="url(#pn)"/>
        <path d="M212 78 C 206 50, 194 34, 174 26 C 176 54, 190 74, 212 78 Z" fill="url(#pn2)"/>
        <path d="M268 102 C 264 74, 254 56, 236 46 C 236 74, 248 96, 268 102 Z" fill="url(#pn)"/>
        <path d="M60 40 C 62 66, 56 86, 42 100 C 34 76, 40 54, 60 40 Z" fill="url(#pn2)"/>
        <path d="M128 64 C 132 90, 128 110, 114 124 C 106 100, 110 78, 128 64 Z" fill="url(#pn)"/>
        <path d="M196 90 C 202 114, 198 134, 186 146 C 178 124, 180 104, 196 90 Z" fill="url(#pn2)"/>
      </g>
      <g fill="url(#sn)">
        <path d="M-12 -4 C 8 -2, 26 8, 40 24 C 20 22, 2 14, -12 -4 Z"/>
        <path d="M48 2 C 66 8, 82 22, 94 40 C 74 36, 58 24, 48 2 Z"/>
        <path d="M112 12 C 130 20, 144 34, 152 56 C 134 50, 120 36, 112 12 Z"/>
        <path d="M176 28 C 194 38, 206 54, 210 76 C 194 68, 182 52, 176 28 Z"/>
        <path d="M238 48 C 254 58, 264 76, 266 100 C 252 90, 242 72, 238 48 Z"/>
        <ellipse cx="66" cy="46" rx="13" ry="6"/><ellipse cx="134" cy="70" rx="12" ry="5.5"/>
        <ellipse cx="202" cy="96" rx="11" ry="5"/>
      </g>
    </g>

    <!-- small sprig, bottom right -->
    <g transform="translate(1200,320) rotate(180)">
      <path d="M-8 20 C 86 32, 160 60, 220 100" fill="none" stroke="url(#bk)" stroke-width="7" stroke-linecap="round"/>
      <path d="M36 24 C 22 6, 8 -2, -8 -4 C 0 16, 16 28, 36 24 Z" fill="url(#pn)"/>
      <path d="M92 40 C 82 18, 68 8, 50 4 C 56 26, 72 40, 92 40 Z" fill="url(#pn2)"/>
      <path d="M150 62 C 144 40, 132 28, 114 22 C 116 44, 130 60, 150 62 Z" fill="url(#pn)"/>
      <path d="M56 38 C 58 60, 52 76, 40 88 C 34 68, 40 50, 56 38 Z" fill="url(#pn2)"/>
      <g fill="url(#sn)">
        <path d="M-6 -2 C 10 0, 24 8, 36 22 C 20 20, 6 12, -6 -2 Z"/>
        <path d="M52 6 C 68 12, 80 24, 90 38 C 74 34, 60 24, 52 6 Z"/>
      </g>
    </g>

    <g fill="#ffffff">
      <circle class="s1" cx="380" cy="-10" r="4"/><circle class="s2" cx="560" cy="-16" r="3"/>
      <circle class="s3" cx="720" cy="-8"  r="4.5"/><circle class="s4" cx="880" cy="-20" r="3"/>
      <circle class="s5" cx="470" cy="-24" r="3.5"/><circle class="s6" cx="980" cy="-12" r="4"/>
    </g>

    <g text-anchor="middle">
      <text x="620" y="152" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
            font-size="58" letter-spacing="3" fill="#26485c">Mingke Tian</text>
      <text x="620" y="188" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="17" letter-spacing="5.5" fill="#4a7189">COMPUTATIONAL MATHEMATICS &amp; COMPUTER SCIENCE</text>
      <line x1="490" y1="208" x2="750" y2="208" stroke="#8fb0c6" stroke-width="1.2"/>
      <text x="620" y="234" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="15" letter-spacing="1.6" fill="#557d94">multimodal ML · agentic systems · world models</text>
    </g>
  </g>
</svg>
