<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300"
     role="img" aria-label="A small white fox sitting in the snow beneath a blossom branch">
  <title>a little snow fox</title>

  <defs>
    <radialGradient id="sky" cx="44%" cy="28%" r="82%">
      <stop offset="0" stop-color="#fbf8fd"/><stop offset=".46" stop-color="#e9eff8"/>
      <stop offset="1" stop-color="#d0dbeb"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6e2" stop-opacity=".85"/><stop offset="1" stop-color="#fff6e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#c9d6ea"/><stop offset="1" stop-color="#e3eaf5"/>
    </linearGradient>

    <linearGradient id="furBody" x1=".2" y1=".05" x2=".8" y2="1">
      <stop offset="0" stop-color="#fcfaf7"/><stop offset=".4" stop-color="#efe9e0"/>
      <stop offset=".78" stop-color="#d8cfc0"/><stop offset="1" stop-color="#bfb3a1"/>
    </linearGradient>
    <radialGradient id="furHead" cx="34%" cy="24%" r="88%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".48" stop-color="#f8f4ee"/>
      <stop offset=".84" stop-color="#e6ddcf"/><stop offset="1" stop-color="#cec2b0"/>
    </radialGradient>
    <linearGradient id="furTail" x1=".92" y1=".1" x2=".1" y2=".95">
      <stop offset="0" stop-color="#cfc4b3"/><stop offset=".22" stop-color="#e7dfd3"/>
      <stop offset=".6" stop-color="#faf7f2"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="muzzle" cx="50%" cy="26%" r="78%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f0e7"/>
    </radialGradient>
    <linearGradient id="earIn" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#f7d9d0"/><stop offset=".55" stop-color="#e3a79d"/>
      <stop offset="1" stop-color="#c5807a"/>
    </linearGradient>
    <radialGradient id="iris" cx="36%" cy="26%" r="80%">
      <stop offset="0" stop-color="#c0904f"/><stop offset=".36" stop-color="#7d5427"/>
      <stop offset="1" stop-color="#2a1a10"/>
    </radialGradient>
    <linearGradient id="nose" x1=".3" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#52413d"/><stop offset="1" stop-color="#221918"/>
    </linearGradient>
    <linearGradient id="snow" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce6f1"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d6c56"/><stop offset="1" stop-color="#5d4436"/>
    </linearGradient>
    <radialGradient id="petal" cx="40%" cy="30%" r="74%">
      <stop offset="0" stop-color="#fff0f5"/><stop offset=".55" stop-color="#fbd2e0"/>
      <stop offset="1" stop-color="#f2afc8"/>
    </radialGradient>

    <filter id="soft"  x="-55%" y="-55%" width="210%" height="210%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="disc"><circle cx="150" cy="150" r="142"/></clipPath>
    <clipPath id="eyeL"><path d="M112 148 C 119 136, 138 135, 145 149 C 138 161, 119 161, 112 148 Z"/></clipPath>
    <clipPath id="eyeR"><path d="M188 148 C 181 136, 162 135, 155 149 C 162 161, 181 161, 188 148 Z"/></clipPath>
  </defs>

  <style>
    .breathe { animation: breathe 5.4s ease-in-out infinite; transform-origin: 50% 84%; transform-box: fill-box; }
    .lid  { animation: blink 6.6s infinite; transform-origin: center top; transform-box: fill-box; }
    .earL { animation: twL 7.4s ease-in-out infinite; transform-origin: 74% 96%; transform-box: fill-box; }
    .earR { animation: twR 7.4s ease-in-out infinite; transform-origin: 26% 96%; transform-box: fill-box; }
    .tail { animation: swish 6.2s ease-in-out infinite; transform-origin: 86% 14%; transform-box: fill-box; }
    .f1,.f2,.f3 { animation: fall 9.5s linear infinite; }
    .f2 { animation-delay: 3.2s; } .f3 { animation-delay: 6.4s; }

    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }
    @keyframes blink { 0%,95.5%,100% { transform: scaleY(0); } 97.5% { transform: scaleY(1); } }
    @keyframes twL { 0%,87%,100% { transform: rotate(0deg); } 91% { transform: rotate(-7deg); } 95% { transform: rotate(2deg); } }
    @keyframes twR { 0%,89%,100% { transform: rotate(0deg); } 93% { transform: rotate(7deg); } 97% { transform: rotate(-2deg); } }
    @keyframes swish { 0%,100% { transform: rotate(-2.6deg); } 50% { transform: rotate(3deg); } }
    @keyframes fall { 0% { opacity:0; transform: translate(0,0) rotate(0); } 12% { opacity:.9; }
                      86% { opacity:.9; } 100% { opacity:0; transform: translate(-30px,160px) rotate(240deg); } }
    @media (prefers-reduced-motion: reduce) {
      .breathe,.lid,.earL,.earR,.tail,.f1,.f2,.f3 { animation: none; } .lid { transform: scaleY(0); }
    }
  </style>

  <g clip-path="url(#disc)">
    <circle cx="150" cy="150" r="142" fill="url(#sky)"/>
    <circle cx="128" cy="94" r="90" fill="url(#glow)"/>

    <path d="M-10 236 C 22 212, 58 216, 90 238 C 56 254, 12 254, -10 244 Z" fill="url(#hill)" opacity=".65"/>
    <path d="M206 232 C 236 206, 278 210, 312 236 C 278 252, 232 252, 206 240 Z" fill="url(#hill)" opacity=".65"/>

    <g>
      <path d="M302 48 C 266 54, 240 68, 219 88" fill="none" stroke="url(#branch)" stroke-width="7" stroke-linecap="round"/>
      <path d="M256 58 C 250 44, 244 36, 234 30" fill="none" stroke="url(#branch)" stroke-width="4" stroke-linecap="round"/>
      <path d="M233 80 C 232 94, 229 103, 222 109" fill="none" stroke="url(#branch)" stroke-width="3.2" stroke-linecap="round"/>
      <g fill="url(#petal)">
        <g><circle cx="233" cy="27" r="7"/><circle cx="242" cy="33" r="6"/><circle cx="228" cy="36" r="5.5"/></g>
        <g><circle cx="266" cy="52" r="7.5"/><circle cx="276" cy="48" r="6"/><circle cx="270" cy="62" r="5.5"/></g>
        <g><circle cx="221" cy="110" r="7"/><circle cx="230" cy="115" r="5.5"/><circle cx="215" cy="119" r="5"/></g>
        <circle cx="292" cy="45" r="6.5"/><circle cx="249" cy="75" r="5"/>
      </g>
      <g fill="#fbe4b4"><circle cx="235" cy="32" r="2"/><circle cx="269" cy="55" r="2"/><circle cx="222" cy="115" r="2"/></g>
    </g>
    <g fill="url(#petal)" opacity=".92">
      <ellipse class="f1" cx="200" cy="32" rx="4.6" ry="3.2"/>
      <ellipse class="f2" cx="246" cy="18" rx="4" ry="2.8"/>
      <ellipse class="f3" cx="174" cy="26" rx="4.2" ry="3"/>
    </g>

    <ellipse cx="150" cy="292" rx="176" ry="66" fill="url(#snow)"/>
    <ellipse cx="150" cy="264" rx="92" ry="17" fill="#c0cfe2" opacity=".38" filter="url(#soft2)"/>

    <!-- ── the fox ─────────────────────────────────────────── -->
    <g class="breathe" transform="translate(0,-8)">
      <ellipse cx="150" cy="262" rx="72" ry="13" fill="#a9bad2" opacity=".35" filter="url(#soft2)"/>

      <!-- brush tail, swept up against the sky where it actually reads -->
      <g class="tail">
        <path d="M170 248
                 C 216 258, 256 232, 264 190
                 C 270 160, 258 138, 242 134
                 C 230 131, 222 140, 224 152
                 C 230 180, 234 202, 218 218
                 C 202 234, 184 238, 168 232 Z"
              fill="url(#furTail)" stroke="#c6bba9" stroke-opacity=".45" stroke-width="1.6"/>
        <g fill="#ffffff" opacity=".45" filter="url(#soft)">
          <ellipse cx="256" cy="180" rx="14" ry="19"/>
          <ellipse cx="248" cy="216" rx="15" ry="13"/>
          <ellipse cx="220" cy="240" rx="17" ry="11"/>
          <ellipse cx="188" cy="248" rx="16" ry="10"/>
        </g>
        <ellipse cx="240" cy="146" rx="20" ry="17" fill="#ffffff" opacity=".92"
                 transform="rotate(20 240 146)" filter="url(#soft)"/>
        <ellipse cx="243" cy="141" rx="13" ry="11" fill="#ffffff" filter="url(#soft)"/>
        <g fill="none" stroke-linecap="round" opacity=".5">
          <path d="M232 168 C 242 186, 244 208, 234 224" stroke="#ffffff" stroke-width="4"/>
          <path d="M206 232 C 194 240, 180 242, 170 238" stroke="#cabfae" stroke-width="2.4"/>
          <path d="M226 200 C 218 214, 204 224, 188 228" stroke="#cabfae" stroke-width="2"/>
        </g>
      </g>
      <ellipse cx="196" cy="222" rx="22" ry="18" fill="#a2957f" opacity=".18" filter="url(#soft)"/>

      <!-- hind body -->
      <path d="M150 176 C 124 176, 108 200, 107 226 C 106 246, 122 258, 150 258
               C 178 258, 194 246, 193 226 C 192 200, 176 176, 150 176 Z" fill="url(#furBody)" stroke="#c6bba9" stroke-opacity=".45" stroke-width="1.6"/>
      <path d="M150 188 C 136 188, 128 208, 128 228 C 128 244, 138 254, 150 254
               C 162 254, 172 244, 172 228 C 172 208, 164 188, 150 188 Z" fill="#ffffff" opacity=".72"/>
      <ellipse cx="132" cy="252" rx="16" ry="9.5" fill="#ffffff"/>
      <ellipse cx="168" cy="252" rx="16" ry="9.5" fill="#ffffff"/>
      <g stroke="#d9d0c2" stroke-width="1.8" stroke-linecap="round">
        <path d="M126 250 L126 256 M132 249 L132 256 M138 250 L138 256"/>
        <path d="M162 250 L162 256 M168 249 L168 256 M174 250 L174 256"/>
      </g>

      <!-- chest fluff, soft lobes not spikes -->
      <g fill="#ffffff">
        <ellipse cx="129" cy="204" rx="13" ry="11"/>
        <ellipse cx="150" cy="210" rx="16" ry="13"/>
        <ellipse cx="171" cy="204" rx="13" ry="11"/>
      </g>
      <ellipse cx="150" cy="206" rx="30" ry="15" fill="#ffffff" opacity=".8" filter="url(#soft)"/>

      <!-- tall ears -->
      <g class="earL">
        <path d="M111 140 C 102 116, 95 82, 96 56 C 118 71, 141 96, 154 117
                 C 142 132, 126 141, 111 140 Z" fill="url(#furHead)"/>
        <path d="M115 132 C 108 113, 102 88, 103 69 C 120 81, 137 101, 147 118
                 C 137 128, 126 133, 115 132 Z" fill="url(#earIn)"/>
        <path d="M106 66 C 110 89, 117 112, 127 128" fill="none" stroke="#ffffff" stroke-width="4.5"
              stroke-linecap="round" opacity=".75"/>
      </g>
      <g class="earR">
        <path d="M189 140 C 198 116, 205 82, 204 56 C 182 71, 159 96, 146 117
                 C 158 132, 174 141, 189 140 Z" fill="url(#furHead)"/>
        <path d="M185 132 C 192 113, 198 88, 197 69 C 180 81, 163 101, 153 118
                 C 163 128, 174 133, 185 132 Z" fill="url(#earIn)"/>
        <path d="M194 66 C 190 89, 183 112, 173 128" fill="none" stroke="#ffffff" stroke-width="4.5"
              stroke-linecap="round" opacity=".75"/>
      </g>

      <!-- cheek ruff, rounded -->
      <g fill="#f7f3ec">
        <ellipse cx="104" cy="150" rx="11" ry="13"/><ellipse cx="103" cy="168" rx="11" ry="12"/>
        <ellipse cx="110" cy="184" rx="11" ry="11"/>
        <ellipse cx="196" cy="150" rx="11" ry="13"/><ellipse cx="197" cy="168" rx="11" ry="12"/>
        <ellipse cx="190" cy="184" rx="11" ry="11"/>
      </g>

      <!-- head -->
      <path d="M150 104 C 182 104, 202 118, 207 142
               C 211 160, 204 174, 190 183
               C 177 191, 165 199, 158 210
               C 154 216, 152 219, 150 219
               C 148 219, 146 216, 142 210
               C 135 199, 123 191, 110 183
               C 96 174, 89 160, 93 142
               C 98 118, 118 104, 150 104 Z" fill="url(#furHead)" stroke="#c6bba9" stroke-opacity=".4" stroke-width="1.6"/>
      <ellipse cx="132" cy="128" rx="30" ry="17" fill="#ffffff" opacity=".6" filter="url(#soft)"/>

      <!-- snout -->
      <path d="M150 162 C 163 162, 171 176, 171 190 C 171 206, 161 219, 150 221
               C 139 219, 129 206, 129 190 C 129 176, 137 162, 150 162 Z" fill="url(#muzzle)"/>
      <ellipse cx="150" cy="206" rx="18" ry="9" fill="#e8e0d4" opacity=".45" filter="url(#soft)"/>

      <ellipse cx="113" cy="170" rx="12" ry="7.5" fill="#efb6c0" opacity=".3" filter="url(#soft)"/>
      <ellipse cx="187" cy="170" rx="12" ry="7.5" fill="#efb6c0" opacity=".3" filter="url(#soft)"/>

      <!-- eyes -->
      <g>
        <path d="M112 148 C 119 136, 138 135, 145 149 C 138 161, 119 161, 112 148 Z" fill="#ffffff"/>
        <path d="M188 148 C 181 136, 162 135, 155 149 C 162 161, 181 161, 188 148 Z" fill="#ffffff"/>
        <g clip-path="url(#eyeL)">
          <circle cx="129" cy="149" r="11.5" fill="url(#iris)"/>
          <circle cx="129" cy="150" r="5.4" fill="#150d09"/>
          <circle cx="125" cy="144" r="4" fill="#ffffff"/>
          <circle cx="133.5" cy="154" r="1.9" fill="#ffffff" opacity=".8"/>
        </g>
        <g clip-path="url(#eyeR)">
          <circle cx="171" cy="149" r="11.5" fill="url(#iris)"/>
          <circle cx="171" cy="150" r="5.4" fill="#150d09"/>
          <circle cx="167" cy="144" r="4" fill="#ffffff"/>
          <circle cx="175.5" cy="154" r="1.9" fill="#ffffff" opacity=".8"/>
        </g>
        <path d="M112 148 C 119 136, 138 135, 145 149" fill="none" stroke="#b5a897" stroke-width="2.1" stroke-linecap="round"/>
        <path d="M188 148 C 181 136, 162 135, 155 149" fill="none" stroke="#b5a897" stroke-width="2.1" stroke-linecap="round"/>
        <path class="lid" d="M110 146 C 119 131, 140 130, 147 147 L 147 130 L 110 130 Z" fill="url(#furHead)"/>
        <path class="lid" d="M190 146 C 181 131, 160 130, 153 147 L 153 130 L 190 130 Z" fill="url(#furHead)"/>
      </g>

      <!-- nose, mouth -->
      <path d="M140 193 C 140 188.5, 160 188.5, 160 193 C 160 199.5, 154 205, 150 205
               C 146 205, 140 199.5, 140 193 Z" fill="url(#nose)"/>
      <ellipse cx="145.5" cy="192" rx="3.3" ry="1.9" fill="#ffffff" opacity=".45"/>
      <path d="M150 205 L150 210" stroke="#3c2f2c" stroke-width="2" stroke-linecap="round"/>
      <path d="M141 215 C 145 220, 148 219, 150 210 C 152 219, 155 220, 159 215"
            fill="none" stroke="#3c2f2c" stroke-width="2" stroke-linecap="round"/>

      <g stroke="#c7bdac" stroke-width="1.3" stroke-linecap="round" opacity=".62" fill="none">
        <path d="M127 186 C 112 181, 100 178, 90 177"/>
        <path d="M128 194 C 113 195, 102 197, 92 200"/>
        <path d="M173 186 C 188 181, 200 178, 210 177"/>
        <path d="M172 194 C 187 195, 198 197, 208 200"/>
      </g>
    </g>

    <ellipse cx="150" cy="300" rx="166" ry="42" fill="url(#snow)"/>
  </g>

  <circle cx="150" cy="150" r="141" fill="none" stroke="#b6c4d8" stroke-opacity=".5" stroke-width="2"/>
</svg>
