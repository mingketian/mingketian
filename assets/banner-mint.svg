<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-label="Mingke Tian — fresh green and blush banner">
  <defs>
    <linearGradient id="sk" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f7fdf9"/><stop offset=".34" stop-color="#e6f7ed"/>
      <stop offset=".68" stop-color="#d5f0e2"/><stop offset="1" stop-color="#fce4ea"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe6" stop-opacity=".9"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fdcb8"/><stop offset=".55" stop-color="#6fc396"/><stop offset="1" stop-color="#48a077"/>
    </linearGradient>
    <linearGradient id="lf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ecd6"/><stop offset="1" stop-color="#8ed0ab"/>
    </linearGradient>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b9a72"/><stop offset="1" stop-color="#47705a"/>
    </linearGradient>
    <radialGradient id="bud" cx="40%" cy="32%" r="74%">
      <stop offset="0" stop-color="#fff2f5"/><stop offset=".6" stop-color="#fbcdda"/><stop offset="1" stop-color="#f3a5be"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeedc"/><stop offset="1" stop-color="#b5e3ca"/>
    </linearGradient>
    <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="fr"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .sway  { animation: sw 6.5s ease-in-out infinite; transform-origin: 0% 0%; transform-box: fill-box; }
    .sway2 { animation: sw2 8s ease-in-out infinite; transform-origin: 0% 0%; transform-box: fill-box; }
    @keyframes sw  { 0%,100%{transform:rotate(-.9deg)} 50%{transform:rotate(.9deg)} }
    @keyframes sw2 { 0%,100%{transform:rotate(.8deg)} 50%{transform:rotate(-.8deg)} }
    .m1,.m2,.m3,.m4 { animation: drift 13s ease-in-out infinite; }
    .m2{animation-delay:3.2s}.m3{animation-delay:6.4s}.m4{animation-delay:9.6s}
    @keyframes drift { 0%{opacity:0;transform:translate(0,0)} 10%{opacity:.85}
                       85%{opacity:.85} 100%{opacity:0;transform:translate(46px,-64px)} }
    @media (prefers-reduced-motion: reduce){ .sway,.sway2,.m1,.m2,.m3,.m4{animation:none} }
  </style>

  <g clip-path="url(#fr)">
    <rect width="1200" height="320" fill="url(#sk)"/>
    <circle cx="212" cy="58" r="140" fill="url(#sun)"/>
    <g filter="url(#bl)" opacity=".45">
      <circle cx="1040" cy="250" r="56" fill="#ffd9e4"/><circle cx="120" cy="250" r="46" fill="#bfe9d2"/>
      <circle cx="880" cy="60" r="40" fill="#e2f7ea"/>
    </g>

    <path d="M0 258 C 160 232, 320 244, 470 268 C 640 294, 830 286, 1200 254 L1200 320 L0 320 Z" fill="url(#hl)" opacity=".8"/>

    <!-- left leafy spray -->
    <g class="sway">
      <path d="M-10 36 C 100 52, 190 92, 262 152" fill="none" stroke="url(#st)" stroke-width="7" stroke-linecap="round"/>
      <path d="M96 50 C 106 26, 122 12, 146 4" fill="none" stroke="url(#st)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M190 96 C 210 92, 232 96, 248 108" fill="none" stroke="url(#st)" stroke-width="4" stroke-linecap="round"/>
      <g>
        <ellipse cx="150" cy="0"   rx="27" ry="12" fill="url(#lf)"  transform="rotate(-38 150 0)"/>
        <ellipse cx="122" cy="16"  rx="23" ry="10" fill="url(#lf2)" transform="rotate(-12 122 16)"/>
        <ellipse cx="56"  cy="30"  rx="28" ry="12" fill="url(#lf)"  transform="rotate(18 56 30)"/>
        <ellipse cx="28"  cy="56"  rx="24" ry="11" fill="url(#lf2)" transform="rotate(-22 28 56)"/>
        <ellipse cx="176" cy="70"  rx="26" ry="11" fill="url(#lf)"  transform="rotate(32 176 70)"/>
        <ellipse cx="252" cy="112" rx="27" ry="12" fill="url(#lf)"  transform="rotate(24 252 112)"/>
        <ellipse cx="224" cy="140" rx="23" ry="10" fill="url(#lf2)" transform="rotate(-30 224 140)"/>
        <ellipse cx="272" cy="158" rx="22" ry="10" fill="url(#lf2)" transform="rotate(52 272 158)"/>
      </g>
      <g fill="url(#bud)">
        <circle cx="148" cy="34" r="10"/><circle cx="162" cy="42" r="7.5"/>
        <circle cx="72" cy="66" r="9"/><circle cx="238" cy="120" r="8.5"/>
      </g>
    </g>

    <!-- right leafy spray -->
    <g transform="translate(1252,346) rotate(180)"><g class="sway2">
      <path d="M-10 30 C 96 46, 182 86, 248 142" fill="none" stroke="url(#st)" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M86 44 C 96 22, 110 10, 132 2" fill="none" stroke="url(#st)" stroke-width="4" stroke-linecap="round"/>
      <g>
        <ellipse cx="136" cy="0"  rx="25" ry="11" fill="url(#lf)"  transform="rotate(-36 136 0)"/>
        <ellipse cx="50"  cy="26" rx="26" ry="11" fill="url(#lf2)" transform="rotate(16 50 26)"/>
        <ellipse cx="24"  cy="52" rx="22" ry="10" fill="url(#lf)"  transform="rotate(-24 24 52)"/>
        <ellipse cx="164" cy="66" rx="24" ry="10" fill="url(#lf2)" transform="rotate(30 164 66)"/>
        <ellipse cx="240" cy="104" rx="25" ry="11" fill="url(#lf)" transform="rotate(22 240 104)"/>
        <ellipse cx="212" cy="132" rx="21" ry="9"  fill="url(#lf2)" transform="rotate(-28 212 132)"/>
      </g>
      <g fill="url(#bud)"><circle cx="134" cy="32" r="9"/><circle cx="64" cy="60" r="8"/></g>
    </g></g>

    <g fill="#ffffff" opacity=".7">
      <circle class="m1" cx="420" cy="250" r="4.5"/><circle class="m2" cx="700" cy="268" r="3.5"/>
      <circle class="m3" cx="880" cy="236" r="4"/><circle class="m4" cx="560" cy="280" r="3"/>
    </g>

    <g text-anchor="middle">
      <text x="600" y="150" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
            font-size="58" letter-spacing="3" fill="#2e6350">Mingke Tian</text>
      <text x="600" y="186" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="17" letter-spacing="5.5" fill="#4e8f72">COMPUTATIONAL MATHEMATICS &amp; COMPUTER SCIENCE</text>
      <line x1="470" y1="206" x2="730" y2="206" stroke="#86c7a5" stroke-width="1.2"/>
      <text x="600" y="232" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="15" letter-spacing="1.6" fill="#5b9b7d">multimodal ML · agentic systems · world models</text>
    </g>
  </g>
</svg>
