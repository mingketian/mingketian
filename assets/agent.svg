<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180"
     role="img" aria-label="A small red panda sitting beside a terminal running Mingke's projects">
  <title>my little red panda, keeping an eye on things</title>

  <style>
    .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bob   { animation: bob 4.2s ease-in-out infinite; }
    .shade { animation: shade 4.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .eye   { animation: blink 5.4s infinite; transform-origin: center; transform-box: fill-box; }
    .earL  { animation: earL 4.8s ease-in-out infinite; transform-origin: 70% 90%; transform-box: fill-box; }
    .earR  { animation: earR 4.8s ease-in-out infinite; transform-origin: 30% 90%; transform-box: fill-box; }
    .tail  { animation: swish 3.4s ease-in-out infinite; transform-origin: 88% 92%; transform-box: fill-box; }
    .caret { animation: caret 1.1s steps(1) infinite; }
    .entry { opacity: 0; animation: cycle 16s ease-in-out infinite; }
    .e2 { animation-delay: 4s; } .e3 { animation-delay: 8s; } .e4 { animation-delay: 12s; }

    @keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes shade { 0%,100% { transform: scaleX(1); opacity: .2; } 50% { transform: scaleX(.9); opacity: .13; } }
    @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    @keyframes earL  { 0%,86%,100% { transform: rotate(0deg); } 90% { transform: rotate(-11deg); } 94% { transform: rotate(3deg); } }
    @keyframes earR  { 0%,88%,100% { transform: rotate(0deg); } 92% { transform: rotate(11deg); } 96% { transform: rotate(-3deg); } }
    @keyframes swish { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
    @keyframes caret { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes cycle { 0%   { opacity: 0; transform: translateY(5px); }
                       3%   { opacity: 1; transform: translateY(0); }
                       22%  { opacity: 1; transform: translateY(0); }
                       25%  { opacity: 0; transform: translateY(-5px); }
                       100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .bob, .shade, .eye, .earL, .earR, .tail, .caret, .entry { animation: none; }
      .entry { opacity: 0; } .e1 { opacity: 1; }
    }
  </style>

  <!-- ── the red panda ───────────────────────────────────────── -->
  <ellipse class="shade" cx="74" cy="162" rx="34" ry="5" fill="#8b949e"/>

  <g class="bob">
    <!-- tail, behind everything, banded -->
    <g class="tail">
      <path d="M 50 140 C 26 142, 12 122, 17 95" fill="none" stroke="#c4552a" stroke-width="19" stroke-linecap="round"/>
      <path d="M 50 140 C 26 142, 12 122, 17 95" fill="none" stroke="#8f4a26" stroke-width="19"
            stroke-dasharray="8 13" stroke-dashoffset="6"/>
      <circle cx="17" cy="95" r="9.5" fill="#5f3520"/>
    </g>

    <!-- body -->
    <path d="M 74 90 C 53 90, 42 112, 42 133 C 42 149, 56 157, 74 157 C 92 157, 106 149, 106 133
             C 106 112, 95 90, 74 90 Z" fill="#c95c2c"/>
    <ellipse cx="74" cy="142" rx="21" ry="13" fill="#432a1f"/>
    <ellipse cx="53" cy="131" rx="9" ry="14" fill="#5a382a" transform="rotate(-8 53 131)"/>
    <ellipse cx="95" cy="131" rx="9" ry="14" fill="#5a382a" transform="rotate(8 95 131)"/>
    <ellipse cx="62" cy="153" rx="12" ry="7" fill="#3d251b"/>
    <ellipse cx="87" cy="153" rx="12" ry="7" fill="#3d251b"/>

    <!-- ears -->
    <g class="earL"><ellipse cx="49" cy="42" rx="15" ry="16" fill="#c4552a"/>
      <ellipse cx="49" cy="44" rx="9" ry="10" fill="#f2e3cf"/></g>
    <g class="earR"><ellipse cx="99" cy="42" rx="15" ry="16" fill="#c4552a"/>
      <ellipse cx="99" cy="44" rx="9" ry="10" fill="#f2e3cf"/></g>

    <!-- head -->
    <ellipse cx="74" cy="66" rx="37" ry="33" fill="#d1622f"/>

    <!-- white mask: cheeks, brows, muzzle -->
    <ellipse cx="55" cy="79" rx="16" ry="14" fill="#f7efe4"/>
    <ellipse cx="93" cy="79" rx="16" ry="14" fill="#f7efe4"/>
    <ellipse cx="74" cy="80" rx="14" ry="12" fill="#f7efe4"/>
    <ellipse cx="59" cy="55" rx="8" ry="5.5" fill="#f7efe4" transform="rotate(-12 59 55)"/>
    <ellipse cx="89" cy="55" rx="8" ry="5.5" fill="#f7efe4" transform="rotate(12 89 55)"/>

    <!-- tear stripes -->
    <path d="M 59 73 C 56.5 79, 54 83.5, 52 87" fill="none" stroke="#c4552a" stroke-width="2.6" stroke-linecap="round" opacity=".62"/>
    <path d="M 89 73 C 91.5 79, 94 83.5, 96 87" fill="none" stroke="#c4552a" stroke-width="2.6" stroke-linecap="round" opacity=".62"/>

    <!-- eyes -->
    <ellipse class="eye" cx="61" cy="66" rx="5.6" ry="6.2" fill="#2b1a14"/>
    <ellipse class="eye" cx="87" cy="66" rx="5.6" ry="6.2" fill="#2b1a14"/>
    <circle cx="63" cy="63.5" r="1.9" fill="#ffffff"/>
    <circle cx="89" cy="63.5" r="1.9" fill="#ffffff"/>

    <!-- nose and mouth -->
    <path d="M 70 77 C 70 74.6, 78 74.6, 78 77 C 78 79.6, 75.4 81.4, 74 81.4 C 72.6 81.4, 70 79.6, 70 77 Z" fill="#2b1a14"/>
    <path d="M 74 81.6 L 74 84" stroke="#2b1a14" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 68.5 86.5 C 71 89, 73 88, 74 84.4 C 75 88, 77 89, 79.5 86.5"
          fill="none" stroke="#2b1a14" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ── the terminal it is watching ─────────────────────────── -->
  <rect x="142" y="30" width="322" height="120" rx="13" fill="none" stroke="#8b949e" stroke-opacity=".38"/>
  <circle cx="160" cy="48" r="3.5" fill="#cc4d68"/>
  <circle cx="173" cy="48" r="3.5" fill="#a87c12"/>
  <circle cx="186" cy="48" r="3.5" fill="#109384"/>
  <line x1="142" y1="63" x2="464" y2="63" stroke="#8b949e" stroke-opacity=".22"/>

  <g class="mono" font-size="13">
    <g class="entry e1">
      <text x="160" y="91" fill="#6f61e8">$ atsolver verify</text>
      <text x="160" y="113" fill="#109384">✓ residual below 1e-8</text>
    </g>
    <g class="entry e2">
      <text x="160" y="91" fill="#6f61e8">$ throughline attribute</text>
      <text x="160" y="113" fill="#109384">→ 12 failures · 100% trainable</text>
    </g>
    <g class="entry e3">
      <text x="160" y="91" fill="#6f61e8">$ parcelvla deploy</text>
      <text x="160" y="113" fill="#109384">▸ action chunk H=16 @ 10 Hz</text>
    </g>
    <g class="entry e4">
      <text x="160" y="91" fill="#6f61e8">$ whoami</text>
      <text x="160" y="113" fill="#a87c12">Mingke · agents that check themselves</text>
    </g>

    <text x="160" y="136" fill="#8b949e" opacity=".75">$</text>
    <rect class="caret" x="171" y="125" width="7" height="13" fill="#8b949e" opacity=".75"/>
  </g>
</svg>
