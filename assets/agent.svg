<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180"
     role="img" aria-label="A small agent mascot running Mingke's projects in a terminal">
  <title>my little agent, doing the rounds</title>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bob    { animation: bob 3.6s ease-in-out infinite; }
    .shadow { animation: shadow 3.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .eye    { animation: blink 5.2s infinite; transform-origin: center; transform-box: fill-box; }
    .ping   { animation: ping 1.9s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .ring   { animation: ring 2.6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    .wave   { animation: wave 3.6s ease-in-out infinite; transform-origin: 33% 11%; transform-box: fill-box; }
    .caret  { animation: caret 1.1s steps(1) infinite; }
    .entry  { opacity: 0; animation: cycle 16s ease-in-out infinite; }
    .e2 { animation-delay: 4s; } .e3 { animation-delay: 8s; } .e4 { animation-delay: 12s; }

    @keyframes bob    { 0%,100% { transform: translateY(0); }    50% { transform: translateY(-4px); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .22; } 50% { transform: scaleX(.86); opacity: .13; } }
    @keyframes blink  { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
    @keyframes ping   { 0%,100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes ring   { 0% { opacity: .5; transform: scale(.55); } 100% { opacity: 0; transform: scale(1.5); } }
    @keyframes wave   { 0%,58%,100% { transform: rotate(0deg); } 68% { transform: rotate(-24deg); }
                        78% { transform: rotate(6deg); } 88% { transform: rotate(-15deg); } }
    @keyframes caret  { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes cycle  { 0%   { opacity: 0; transform: translateY(5px); }
                        3%   { opacity: 1; transform: translateY(0); }
                        22%  { opacity: 1; transform: translateY(0); }
                        25%  { opacity: 0; transform: translateY(-5px); }
                        100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .bob, .shadow, .eye, .ping, .ring, .wave, .caret, .entry { animation: none; }
      .entry { opacity: 0; } .e1 { opacity: 1; }
    }
  </style>

  <!-- ── the agent ───────────────────────────────────────────── -->
  <ellipse class="shadow" cx="70" cy="161" rx="27" ry="4.5" fill="#8b949e"/>

  <g class="bob" transform="translate(0,4)">
    <!-- antenna -->
    <line x1="70" y1="31" x2="70" y2="45" stroke="#6a5de0" stroke-width="3" stroke-linecap="round"/>
    <circle class="ring" cx="70" cy="27" r="5" fill="none" stroke="#3fd0bd" stroke-width="2"/>
    <circle class="ping" cx="70" cy="27" r="4.5" fill="#3fd0bd"/>

    <!-- head -->
    <rect x="42" y="45" width="56" height="46" rx="15" fill="#7c6ff0"/>
    <rect x="51" y="56" width="38" height="25" rx="9" fill="#171c2e"/>
    <circle class="eye" cx="61.5" cy="68.5" r="4.2" fill="#4fe3cd"/>
    <circle class="eye" cx="78.5" cy="68.5" r="4.2" fill="#4fe3cd"/>

    <!-- limbs first, so the torso covers where they join -->
    <rect x="53" y="126" width="11" height="22" rx="5.5" fill="#4f43b8"/>
    <rect x="76" y="126" width="11" height="22" rx="5.5" fill="#4f43b8"/>
    <rect x="36" y="100" width="9" height="27" rx="4.5" fill="#5d51cf"/>
    <rect class="wave" x="92" y="100" width="9" height="27" rx="4.5" fill="#5d51cf"/>

    <!-- torso -->
    <rect x="63" y="89" width="14" height="8" fill="#5d51cf"/>
    <rect x="45" y="94" width="50" height="41" rx="14" fill="#6a5de0"/>
    <circle cx="70" cy="111" r="8" fill="none" stroke="#c2881f" stroke-width="1.6" opacity=".4"/>
    <circle class="ping" cx="70" cy="111" r="4" fill="#e0a83c"/>
  </g>

  <!-- ── the terminal it is talking to ───────────────────────── -->
  <rect x="142" y="30" width="322" height="120" rx="13" fill="none" stroke="#8b949e" stroke-opacity=".38"/>
  <circle cx="160" cy="48" r="3.5" fill="#cc4d68"/>
  <circle cx="173" cy="48" r="3.5" fill="#a87c12"/>
  <circle cx="186" cy="48" r="3.5" fill="#109384"/>
  <line x1="142" y1="63" x2="464" y2="63" stroke="#8b949e" stroke-opacity=".22"/>

  <g class="mono" font-size="13">
    <g class="entry e1">
      <text x="160" y="91" fill="#6f61e8">$ atsolver verify</text>
      <text x="160" y="113" fill="#109384">✓ residual below 1e-8</text>
    </g>
    <g class="entry e2">
      <text x="160" y="91" fill="#6f61e8">$ throughline attribute</text>
      <text x="160" y="113" fill="#109384">→ 12 failures · 100% trainable</text>
    </g>
    <g class="entry e3">
      <text x="160" y="91" fill="#6f61e8">$ parcelvla deploy</text>
      <text x="160" y="113" fill="#109384">▸ action chunk H=16 @ 10 Hz</text>
    </g>
    <g class="entry e4">
      <text x="160" y="91" fill="#6f61e8">$ whoami</text>
      <text x="160" y="113" fill="#a87c12">Mingke · agents that check themselves</text>
    </g>

    <text x="160" y="136" fill="#8b949e" opacity=".75">$</text>
    <rect class="caret" x="171" y="125" width="7" height="13" fill="#8b949e" opacity=".75"/>
  </g>
</svg>
